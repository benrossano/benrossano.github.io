# Local overrides of plugin-owned files.
#
# Each entry records the owning gem, the gem version the local copy was forked
# from, and the SHA256 of both the upstream file and the local file. After a
# `bundle update`, run `bundle exec al-folio upgrade overrides audit` to detect
# upstream drift, then `overrides diff <path>` / `overrides accept <path>`.
#
# NOTE: this file was authored by hand (no Ruby/bundler available on the
# authoring machine), following the schema in CLAUDE.md. Re-run the audit
# command to regenerate it canonically.
overrides:
  - path: _layouts/bib.liquid
    owner: al_folio_core
    version: 1.0.11
    upstream_sha256: 430311d9b94adf6fb1c2fab7609f6e726efc98e2b50e7b1c4cde0ad654c04506
    local_sha256: 2e4bd4e6b35417e0fe9689318ee6f6f7870f761ab46e3738092c3ebc707dc210
    reason: >-
      Link a publication's title to its project page when the bib entry defines
      a `project_page` field. Upstream renders the title as plain text and has
      no field that hyperlinks it; `website`/`html` only add buttons to the
      links row. Single-hunk change at the title block; everything else is
      verbatim upstream.
  - path: _layouts/about.liquid
    owner: al_folio_core
    version: 1.0.11
    upstream_sha256: 2c28eb83b71fe65f252202c11f0b4a19a9b6f1faccdc870b4f91c4ea51d0c6f1
    local_sha256: 1b461bc0ed1ef5aaf1b83bf5356fbab257578e787aa6fd5a78809e0f5e6242a2
    reason: >-
      The selected-papers heading reads "publications" instead of "selected
      publications". The string is hard-coded upstream with no config key.
      One-line change.
  - path: _includes/footer.liquid
    owner: al_folio_core
    version: 1.0.11
    upstream_sha256: 65219faad5445eb4456649d77921acd07845875bbcad4fb8f33b12b3d52d96d2
    local_sha256: 5c6b4221dffbbf50bc49d8fc03b670ca52e102ae05c3f43df39eda947361f705
    reason: >-
      Appends `{% include favicon-animation.liquid %}` so the animated-favicon
      script loads on every page. al_folio_core exposes no head/scripts hook
      (only _includes/hook/bib.liquid), and this is the smallest gem-owned
      include rendered site-wide. Nothing else is changed.
  - path: _includes/head.liquid
    owner: al_folio_core
    version: 1.0.11
    upstream_sha256: f4e1a5a93ba324f05760652013eb0d44769ec932477a5a0afa70c271153b8278
    local_sha256: 44810dbd058133ceb5277ded3fe4148f3f7effa5d6c1665ac567658b0c416520
    reason: >-
      Seed the stored theme preference to "light" before initTheme() runs, so
      visitors whose OS is in dark mode still get the light site by default.
      Upstream defaults the setting to "system" and writes it on first visit,
      so a one-time version-keyed marker is used rather than an "only if unset"
      check. Single added hunk in the dark-mode block; the theme toggle itself
      is unchanged.
