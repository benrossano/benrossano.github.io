# scholar_userid: XXXXXXXXXXXX # Google Scholar ID: open your profile, copy the value after `user=` in the URL
github_username: benrossano # your GitHub username
# linkedin_username: your-linkedin # LinkedIn vanity name: the part after /in/ in linkedin.com/in/<this>
rss_icon: true # comment this line to hide the RSS icon


